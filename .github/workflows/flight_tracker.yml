name: KNU to IXE WhatsApp Flight Tracker

on:
  schedule:
    # Every 6 hours. With TZ=Asia/Kolkata the 12:15 UTC run lands ~17:45 IST,
    # which falls inside the evening digest window (17:00-23:00 IST).
    - cron: '15 */6 * * *'
  workflow_dispatch:

# Needed so the workflow can commit the updated price history back to the repo.
permissions:
  contents: write

# Prevent overlapping runs from racing on the history commit.
concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          TZ: 'Asia/Kolkata'
        run: python -m flighttracker

      - name: Persist price history
        if: always()
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "flight-tracker-bot@users.noreply.github.com"
          git add data/price_history.jsonl data/alert_state.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: update price history [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
