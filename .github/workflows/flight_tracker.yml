name: KNU to IXE WhatsApp Flight Tracker

on:
  schedule:
    # Every 6 hours. With TZ=Asia/Kolkata the 12:15 UTC run lands ~17:45 IST,
    # which falls inside the evening digest window (17:00-23:00 IST).
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin IATA (e.g. KNU). Leave blank to use config.yaml routes."
        required: false
        default: ""
      destination:
        description: "Destination IATA (e.g. BOM). Leave blank to use config.yaml routes."
        required: false
        default: ""
      departure_date:
        description: "Departure date YYYY-MM-DD (required if origin/destination set)."
        required: false
        default: ""
      currency:
        description: "Currency code."
        required: false
        default: "INR"

# Needed so the workflow can commit the updated price history back to the repo.
permissions:
  contents: write

# Prevent overlapping runs from racing on the history commit.
concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          TZ: 'Asia/Kolkata'
          IN_ORIGIN: ${{ github.event.inputs.origin }}
          IN_DEST: ${{ github.event.inputs.destination }}
          IN_DATE: ${{ github.event.inputs.departure_date }}
          IN_CUR: ${{ github.event.inputs.currency }}
        run: |
          if [ -n "$IN_ORIGIN" ] && [ -n "$IN_DEST" ] && [ -n "$IN_DATE" ]; then
            echo "One-off route: $IN_ORIGIN -> $IN_DEST on $IN_DATE"
            python -m flighttracker \
              --origin "$IN_ORIGIN" \
              --destination "$IN_DEST" \
              --date "$IN_DATE" \
              --currency "${IN_CUR:-INR}"
          else
            python -m flighttracker
          fi

      - name: Persist price history
        if: always()
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "flight-tracker-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: update price history [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
