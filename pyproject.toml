[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flighttracker"
version = "1.0.0"
description = "Continuously track flight fares, decide if it is the right time to book, and alert on WhatsApp."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
flighttracker = "flighttracker.cli:main"

[tool.setuptools.packages.find]
include = ["flighttracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
